name: Build & Release (Windows x64)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin (.asi)
        run: cmake --build ${{ github.workspace }}/build --config Release

      - name: Verify Built Binary
        shell: pwsh
        run: |
          $asi = Get-ChildItem -Path "${{ github.workspace }}/build" -Filter "*.asi" -Recurse
          if (-not $asi) {
            Write-Error "No .asi plugin was found in the build directory!"
            exit 1
          }
          Write-Host "Found binary: $($asi.FullName)"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XtremeFork-Universal-Windows-x64
          path: |
            ${{ github.workspace }}/build/**/*.asi
            ${{ github.workspace }}/dist/Put in main folder/XtremeTool.ini
            ${{ github.workspace }}/dist/ReadMe_Install.txt
            ${{ github.workspace }}/dist/Documentation_Config.txt

      - name: Package Release ZIP
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist-package" -Force
          $asi = Get-ChildItem -Path "${{ github.workspace }}/build" -Filter "*.asi" -Recurse | Select-Object -First 1
          Copy-Item $asi.FullName -Destination "dist-package/$($asi.Name)"
          Copy-Item "dist/Put in main folder/XtremeTool.ini" -Destination "dist-package/XtremeTool.ini"
          Copy-Item "dist/ReadMe_Install.txt" -Destination "dist-package/ReadMe_Install.txt"
          Copy-Item "dist/Documentation_Config.txt" -Destination "dist-package/Documentation_Config.txt"
          if (Test-Path ".RELEASE_NOTES.md") {
            Copy-Item ".RELEASE_NOTES.md" -Destination "dist-package/RELEASE_NOTES.md"
          }
          Compress-Archive -Path "dist-package/*" -DestinationPath "XtremeFork-Universal-Windows-x64.zip"

      - name: Prepare Release Metadata
        id: meta
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref_name }}"
            $name = "Release $tag"
            $body = "Official release $tag."
            if (Test-Path ".RELEASE_NOTES.md") {
              $body = Get-Content ".RELEASE_NOTES.md" -Raw
            }
          } else {
            $tag = "experimental"
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $name = "Experimental Build ($shortSha)"
            $body = @"
## ⚠️ Experimental Rolling Build

Automated experimental build from commit [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

This build is automatically re-compiled and published on every commit to `main`.

### Assets Included:
- **`XtremeFork-Universal-Windows-x64.zip`**: Contains the latest compiled `XtremeTool.asi`, default `XtremeTool.ini`, and reference documentation.
"@
          }

          # Output variables to GitHub step outputs
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$name"
          Set-Content -Path "release_body.md" -Value $body

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release_body.md
          files: XtremeFork-Universal-Windows-x64.zip
          draft: false
          prerelease: true
